<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒數計時器 + 番茄鐘</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            transition: background-color 0.5s;
            overflow-x: hidden;
        }

        body.flash {
            background-color: white;
        }

        .page {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .floating-countdown {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(26, 26, 26, 0.9);
            padding: 15px;
            border-radius: 10px;
            display: none;
            transform: scale(0.6);
            transform-origin: top right;
            z-index: 1000;
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: nowrap;
        }

        .countdown-item {
            text-align: center;
        }

        .number {
            font-size: 5rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem 2rem;
            border-radius: 10px;
            min-width: 120px;
            display: inline-block;
        }

        .floating-countdown .number {
            font-size: 2rem;
            min-width: 60px;
            padding: 0.5rem 1rem;
        }

        .label {
            font-size: 1.5rem;
            margin-top: 0.5rem;
        }

        .floating-countdown .label {
            font-size: 1rem;
        }

        .pomodoro-container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            width: 100%;
            max-width: 600px;
            margin: 0 2rem;
        }

        .pomodoro-timer {
            font-size: 4rem;
            margin: 1rem 0;
        }

        .pomodoro-controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 1rem 0;
        }

        button {
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .settings {
            margin-top: 1rem;
        }

        .settings label {
            margin: 0 1rem;
            display: inline-block;
        }

        input[type="number"] {
            width: 60px;
            padding: 0.3rem;
            margin: 0 0.5rem;
        }

        @media (max-width: 768px) {
            .countdown-container {
                flex-wrap: wrap;
                gap: 1rem;
            }

            .countdown-item {
                flex-basis: calc(50% - 1rem);
            }

            .number {
                font-size: 3rem;
                min-width: 80px;
                padding: 0.5rem 1rem;
            }

            .floating-countdown {
                transform: scale(0.5);
            }

            .floating-countdown .countdown-container {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .pomodoro-timer {
                font-size: 3rem;
            }

            .settings label {
                display: block;
                margin: 0.5rem 0;
            }

            .pomodoro-controls {
                flex-direction: column;
                align-items: stretch;
            }

            button {
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>
    <div id="mainCountdown" class="page">
        <div>
            <h1>距離考試還有</h1>
            <div class="countdown-container">
                <div class="countdown-item">
                    <div class="number" id="days">00</div>
                    <div class="label">天</div>
                </div>
                <div class="countdown-item">
                    <div class="number" id="hours">00</div>
                    <div class="label">時</div>
                </div>
                <div class="countdown-item">
                    <div class="number" id="minutes">00</div>
                    <div class="label">分</div>
                </div>
                <div class="countdown-item">
                    <div class="number" id="seconds">00</div>
                    <div class="label">秒</div>
                </div>
            </div>
        </div>
    </div>

    <div id="floatingCountdown" class="floating-countdown">
        <div class="countdown-container">
            <div class="countdown-item">
                <div class="number" id="daysFloat">00</div>
                <div class="label">天</div>
            </div>
            <div class="countdown-item">
                <div class="number" id="hoursFloat">00</div>
                <div class="label">時</div>
            </div>
            <div class="countdown-item">
                <div class="number" id="minutesFloat">00</div>
                <div class="label">分</div>
            </div>
            <div class="countdown-item">
                <div class="number" id="secondsFloat">00</div>
                <div class="label">秒</div>
            </div>
        </div>
    </div>

    <div class="page">
        <div class="pomodoro-container">
            <h2>番茄鐘</h2>
            <div class="pomodoro-timer" id="pomodoroTimer">25:00</div>
            <div class="pomodoro-controls">
                <button id="startPomodoro">開始</button>
                <button id="pausePomodoro" disabled>暫停</button>
                <button id="resetPomodoro" disabled>重置</button>
            </div>
            <div class="settings">
                <label>
                    工作時間：
                    <input type="number" id="workDuration" value="25" min="1" max="60"> 分鐘
                </label>
                <label>
                    休息時間：
                    <input type="number" id="breakDuration" value="10" min="1" max="30"> 分鐘
                </label>
            </div>
        </div>
    </div>

    <script>
        // 考試倒數計時功能
        function updateCountdown() {
            const targetDate = new Date('2025-02-05T00:00:00');
            const now = new Date();
            const difference = targetDate - now;

            if (difference <= 0) {
                updateElements('00', '00', '00', '00');
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            updateElements(
                days.toString().padStart(2, '0'),
                hours.toString().padStart(2, '0'),
                minutes.toString().padStart(2, '0'),
                seconds.toString().padStart(2, '0')
            );
        }

        function updateElements(days, hours, minutes, seconds) {
            // 更新主要倒數計時
            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;

            // 更新浮動倒數計時
            document.getElementById('daysFloat').textContent = days;
            document.getElementById('hoursFloat').textContent = hours;
            document.getElementById('minutesFloat').textContent = minutes;
            document.getElementById('secondsFloat').textContent = seconds;
        }

        // 滾動效果
        function handleScroll() {
            const mainCountdown = document.getElementById('mainCountdown');
            const floatingCountdown = document.getElementById('floatingCountdown');
            const scrollPosition = window.scrollY;
            const viewportHeight = window.innerHeight;

            if (scrollPosition > viewportHeight * 0.3) {
                floatingCountdown.style.display = 'block';
            } else {
                floatingCountdown.style.display = 'none';
            }
        }

        // 番茄鐘功能
        class PomodoroTimer {
            constructor() {
                this.workDuration = 25;
                this.breakDuration = 10;
                this.timeLeft = this.workDuration * 60;
                this.isRunning = false;
                this.isWorkTime = true;
                this.timer = null;

                this.timerDisplay = document.getElementById('pomodoroTimer');
                this.startButton = document.getElementById('startPomodoro');
                this.pauseButton = document.getElementById('pausePomodoro');
                this.resetButton = document.getElementById('resetPomodoro');
                this.workInput = document.getElementById('workDuration');
                this.breakInput = document.getElementById('breakDuration');

                this.setupEventListeners();
            }

            setupEventListeners() {
                this.startButton.addEventListener('click', () => this.start());
                this.pauseButton.addEventListener('click', () => this.pause());
                this.resetButton.addEventListener('click', () => this.reset());
                this.workInput.addEventListener('change', () => this.updateDurations());
                this.breakInput.addEventListener('change', () => this.updateDurations());
            }

            updateDurations() {
                if (!this.isRunning) {
                    this.workDuration = parseInt(this.workInput.value);
                    this.breakDuration = parseInt(this.breakInput.value);
                    this.timeLeft = this.workDuration * 60;
                    this.updateDisplay();
                }
            }

            start() {
                if (!this.isRunning) {
                    this.isRunning = true;
                    this.timer = setInterval(() => this.tick(), 1000);
                    this.startButton.disabled = true;
                    this.pauseButton.disabled = false;
                    this.resetButton.disabled = false;
                }
            }

            pause() {
                if (this.isRunning) {
                    this.isRunning = false;
                    clearInterval(this.timer);
                    this.startButton.disabled = false;
                    this.pauseButton.disabled = true;
                }
            }

            reset() {
                this.isRunning = false;
                clearInterval(this.timer);
                this.isWorkTime = true;
                this.timeLeft = this.workDuration * 60;
                this.updateDisplay();
                this.startButton.disabled = false;
                this.pauseButton.disabled = true;
                this.resetButton.disabled = true;
            }

            tick() {
                if (this.timeLeft > 0) {
                    this.timeLeft--;
                    this.updateDisplay();
                } else {
                    this.switchMode();
                }
            }

            switchMode() {
                this.isWorkTime = !this.isWorkTime;
                this.timeLeft = (this.isWorkTime ? this.workDuration : this.breakDuration) * 60;
                this.updateDisplay();
                this.flashScreen();
                this.vibrate();
            }

            flashScreen() {
                document.body.classList.add('flash');
                setTimeout(() => {
                    document.body.classList.remove('flash');
                }, 500);
            }

            vibrate() {
                if (navigator.vibrate) {
                    navigator.vibrate(500);
                }
            }

            updateDisplay() {
                const minutes = Math.floor(this.timeLeft / 60);
                const seconds = this.timeLeft % 60;
                this.timerDisplay.textContent = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                this.timerDisplay.style.color = this.isWorkTime ? 'white' : '#4CAF50';
            }
        }

        // 初始化
        updateCountdown();
        setInterval(updateCountdown, 1000);
        window.addEventListener('scroll', handleScroll);
        const pomodoro = new PomodoroTimer();
    </script>
</body>
</html>
